name: Codex Developer

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch for Codex to work on"
        required: true
        type: string

      issue_number:
        description: "GitHub issue number"
        required: true
        type: string

      issue_title:
        description: "GitHub issue title"
        required: true
        type: string

      issue_body:
        description: "GitHub issue description"
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"

          prompt: |
            You are the software engineer working on this repository.

            This is an unattended automated workflow.
            There is no human available to answer questions or approve actions.

            Do not ask for clarification or wait for user input.
            Make reasonable engineering decisions yourself.
            If something cannot be completed, explain the problem and exit.

            Repository:
            ${{ github.repository }}

            GitHub Issue #${{ inputs.issue_number }}

            Title:
            ${{ inputs.issue_title }}

            Description:
            ${{ inputs.issue_body }}

            Branch:
            ${{ inputs.branch }}

            Your task is to implement this issue completely.

            Before coding:
            - Inspect the repository.
            - Understand the existing architecture.
            - Identify the files that need to change.

            While coding:
            - Follow existing coding conventions.
            - Keep the changes focused on this issue.
            - Add or update tests where appropriate.
            - Do not modify unrelated functionality.

            Before finishing:
            - Run the relevant tests.
            - Fix failures caused by your changes.
            - Review your own changes for obvious bugs.
            - Stage all appropriate changes.
            - Commit the changes to the current branch.
            - Push the commit to the current branch.

            Do not modify GitHub Actions workflows.

            After the commit has been pushed successfully, your task is complete.
            Do not continue investigating, refactoring, or making additional changes.

            Return a brief final summary containing:
            - What you changed
            - Tests/checks performed
            - Commit SHA
            - Push status

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ inputs.issue_title }}
        run: |
          curl --fail-with-body \
            --request POST \
            --url https://api.github.com/repos/${{ github.repository }}/pulls \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            --data @- <<EOF
          {
            "title": "$ISSUE_TITLE",
            "head": "$BRANCH",
            "base": "main",
            "body": "Closes #$ISSUE_NUMBER\n\n## Changes\n\nImplemented by Codex.\n\nThis PR was automatically created after the Codex implementation completed."
          }
          EOF
